name: Deploy Firebase Function

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create serviceAccount.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > functions/serviceAccount.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Deploy to Firebase
        run: |
          cd functions
          npx firebase-tools deploy --only functions --project helvetia-tools --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/serviceAccount.json
